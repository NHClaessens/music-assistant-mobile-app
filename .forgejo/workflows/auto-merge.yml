---
name: Auto-Merge Upstream with opencode Conflict Resolution
"on":
  schedule:
    - cron: '0 6 * * 6'  # 06:00 every saturday
  workflow_dispatch:
    inputs:
      force_app_build:
        description: Build and release the app even when already up to date with upstream
        required: false
        default: false
        type: boolean

# This workflow uses opencode CLI with tool-calling capabilities to iteratively
# resolve merge conflicts. It can:
# - Read both versions of conflicted files
# - Generate merged versions
# - Run gradle to verify the resolution compiles
# - Iterate up to N times if verification fails
#
# Requirements:
# - opencode CLI must be installed or installable via the install script
# - OPENCODE_API_KEY secret must be configured for LLM access
# - The scripts/opencode-resolve-merge helper must be present
#
# Configure in Forgejo UI:
#   Variables: UPSTREAM_REPO_URL, UPSTREAM_BRANCH, TARGET_BRANCH,
#     IMAGE_REGISTRY, DOCKER_IMAGE_NAME, LLM_ENDPOINT, LLM_MODEL
#   Secrets: IMAGE_REGISTRY_USER, IMAGE_REGISTRY_PASSWORD,
#     LLM_API_KEY (optional)
#   Auth: checkout/push use the job's github.token (same Forgejo repo).
#   Upstream fetch is unauthenticated (public remote).
#   Registry: IMAGE_REGISTRY_PASSWORD must be a user PAT with
#     read:package + write:package (account password / github.token
#     usually get unauthorized: reqPackageAccess on push).
#
# Docker: set container.docker_host: 'automount' on the runner (shares the
# runner's /var/run/docker.sock into job containers). Do not also mount it
# from the workflow — that causes "Duplicate mount point".

jobs:
  sync-upstream:
    runs-on: ${{ vars.RUNNER_LABEL }}
    container:
      image: alvrme/alpine-android:android-37.1-jdk21
    steps:
      - name: Install tools
        # buildx on the host is unused here — the job needs its own CLI plugin;
        # the shared socket only exposes the daemon.
        run: apk add --no-cache git curl jq docker-cli docker-cli-buildx nodejs npm

      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Add upstream remote
        run: |
          git remote add upstream "${{ vars.UPSTREAM_REPO_URL }}"
          git fetch upstream

      - name: Check for upstream changes
        id: check
        run: |
          git checkout "${{ vars.TARGET_BRANCH }}"
          if git merge-base --is-ancestor \
            "upstream/${{ vars.UPSTREAM_BRANCH }}" HEAD; then
            echo "Already up to date with upstream — nothing to do."
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.check.outputs.up_to_date != 'true'
        run: |
          git config --global user.name "forgejo-runner"
          git config --global user.email "runner@forgejo.org"

      - name: Attempt merge
        id: merge
        if: steps.check.outputs.up_to_date != 'true'
        run: |
          if ! git merge \
            "upstream/${{ vars.UPSTREAM_BRANCH }}" --no-edit; then
            echo "MERGE_CONFLICT=1" >> "$GITHUB_ENV"
          fi
        continue-on-error: true

      - name: Resolve conflicts with opencode CLI
        if: steps.check.outputs.up_to_date != 'true' && env.MERGE_CONFLICT == '1'
        run: |
          set -e
          
          # Install opencode CLI via npm - REQUIRED, no fallback
          if ! command -v opencode &> /dev/null; then
            echo "Installing opencode CLI via npm..."
            npm install -g @opencode/cli
          fi
          
          # Verify opencode is available - FAIL HARD if not
          if ! opencode --version &> /dev/null; then
            echo "::error::opencode CLI is REQUIRED but not available"
            echo "npm install failed - check npm access and network"
            exit 1
          fi
          
          echo "opencode CLI version: $(opencode --version)"
          
          CONFLICTED_FILES=$(git diff --name-only --diff-filter=U)
          if [ -z "$CONFLICTED_FILES" ]; then
            echo "No conflicts to resolve."
            exit 0
          fi
          
          echo "Found conflicted files: $CONFLICTED_FILES"
          
          # Set up environment for opencode
          export OPENCODE_API_KEY="${{ secrets.LLM_API_KEY }}"
          export OPENCODE_MODEL="${{ vars.LLM_MODEL }}"
          export OPENCODE_ENDPOINT="${{ vars.LLM_ENDPOINT }}"
          
          # Create a temporary directory for opencode session
          OPENCODE_WORKDIR=$(mktemp -d)
          chmod 777 "$OPENCODE_WORKDIR"
          
          # Track which files were successfully resolved
          RESOLVED_FILES=()
          FAILED_FILES=()
          
          for file in $CONFLICTED_FILES; do
            echo "========================================"
            echo "Resolving conflicts in: $file"
            echo "========================================"
            
            RESOLUTION_ATTEMPT=1
            MAX_ATTEMPTS=3
            RESOLVED=false
            
            while [ $RESOLUTION_ATTEMPT -le $MAX_ATTEMPTS ] && [ "$RESOLVED" = false ]; do
              echo "Attempt $RESOLUTION_ATTEMPT of $MAX_ATTEMPTS for $file"
              
              # Use the opencode-resolve-merge script
              if ./scripts/opencode-resolve-merge \
                --file "$file" \
                --base "upstream/${{ vars.UPSTREAM_BRANCH }}" \
                --head "${{ vars.TARGET_BRANCH }}" \
                --verify-command "./gradlew :composeApp:compileAndroidMain --no-daemon --quiet" \
                --max-iterations 5 \
                --workdir "$OPENCODE_WORKDIR" \
                --output "/tmp/resolved_$file"; then
                
                if [ -f "/tmp/resolved_$file" ]; then
                  cp "/tmp/resolved_$file" "$file"
                  
                  if grep -q '<<<<<<< \|=======\|>>>>>>>' "$file"; then
                    echo "Conflict markers still present in $file"
                  else
                    if timeout 120 ./gradlew :composeApp:compileAndroidMain --no-daemon --quiet 2>&1 | \
                      grep -q "BUILD SUCCESSFUL\|UP-TO-DATE"; then
                      echo "Successfully resolved and verified: $file"
                      git add "$file"
                      RESOLVED_FILES+=("$file")
                      RESOLVED=true
                      break
                    else
                      echo "Resolution didn't compile, trying again..."
                      git checkout -- "$file" 2>/dev/null || true
                    fi
                  fi
                fi
              fi
              
              RESOLUTION_ATTEMPT=$((RESOLUTION_ATTEMPT + 1))
            done
            
            if [ "$RESOLVED" = false ]; then
              echo "::error file=$file::Failed to resolve conflict after $MAX_ATTEMPTS attempts"
              FAILED_FILES+=("$file")
            fi
          done
          
          if [ ${#FAILED_FILES[@]} -gt 0 ]; then
            echo "::error::Some conflicts could not be resolved automatically"
            echo "Failed files: ${FAILED_FILES[*]}"
            
            git commit -m "Auto-merge upstream/${{ vars.UPSTREAM_BRANCH }} (Partial opencode resolution - manual fix required)" || true
            BRANCH_NAME="auto-merge-manual-fix-$(date +%s)"
            git checkout -b "$BRANCH_NAME" 2>/dev/null || git switch -c "$BRANCH_NAME"
            git push origin "$BRANCH_NAME" || true
            
            PR_RESPONSE=$(curl -s -X POST "${{ github.server_url }}/api/v1/repos/nils/music-assistant-mobile-app/pulls" \
              -H "Authorization: token ${{ github.token }}" \
              -H "Content-Type: application/json" \
              -d "{\"title\": \"Manual Resolution Required: Upstream Merge\", \"body\": \"The auto-merge process encountered conflicts that opencode could not resolve automatically. Files needing manual resolution: ${FAILED_FILES[*]}\", \"head\": \"$BRANCH_NAME\", \"base\": \"${{ vars.TARGET_BRANCH }}\"}")
            
            echo "PR response: $PR_RESPONSE"
            git checkout "${{ vars.TARGET_BRANCH }}" 2>/dev/null || true
            exit 1
          fi
          
          if [ ${#RESOLVED_FILES[@]} -gt 0 ]; then
            echo "Successfully resolved all conflicts with opencode"
            echo "Resolved files: ${RESOLVED_FILES[*]}"
          fi
          
          git commit -m "$(printf '%s\n' "Auto-merge upstream/${{ vars.UPSTREAM_BRANCH }}" "with opencode conflict resolution")"


      - name: Push merged branch
        if: success() && steps.check.outputs.up_to_date != 'true'
        run: git push origin "${{ vars.TARGET_BRANCH }}"
      
      - name: Setup Gradle
        if: >-
          success() && (
            steps.check.outputs.up_to_date != 'true' ||
            inputs.force_app_build == true
          )
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        if: >-
          success() && (
            steps.check.outputs.up_to_date != 'true' ||
            inputs.force_app_build == true
          )
        run: ./gradlew :androidApp:assembleSelfSignedRelease
      
      - name: Prepare release assets
        if: >-
          success() && (
            steps.check.outputs.up_to_date != 'true' ||
            inputs.force_app_build == true
          )
        run: |
          mkdir -p release-assets
          cp androidApp/build/outputs/apk/selfSignedRelease/androidApp-arm64-v8a-selfSignedRelease.apk release-assets/
      
      - uses: actions/forgejo-release@v2.13.4
        if: >-
          success() && (
            steps.check.outputs.up_to_date != 'true' ||
            inputs.force_app_build == true
          )
        with:
          direction: upload
          url: https://git.nilsc.org
          repo: nils/music-assistant-mobile-app
          token: ${{ github.token }}
          tag: v1.0.0
          release-dir: release-assets
          release-notes: "New update with upstream changes"

      # - name: Build and Push Docker Image
      #   if: >-
      #     success() && (
      #       steps.check.outputs.up_to_date != 'true' ||
      #       inputs.force_docker_build == true
      #     )
      #   run: |
      #     if ! docker info >/dev/null 2>&1; then
      #       echo "::error::No Docker daemon in this job (need container.docker_host: automount)."
      #       exit 1
      #     fi
      #     docker buildx version
      #     echo "${{ secrets.IMAGE_REGISTRY_PASSWORD }}" | docker login \
      #       -u "${{ secrets.IMAGE_REGISTRY_USER }}" \
      #       --password-stdin "${{ vars.IMAGE_REGISTRY }}"
      #     IMAGE="${{ vars.IMAGE_REGISTRY }}/${{ vars.DOCKER_IMAGE_NAME }}"
      #     docker buildx build --push -t "${IMAGE}:latest" .
