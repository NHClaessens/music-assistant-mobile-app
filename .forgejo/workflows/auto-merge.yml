---
name: Auto-Merge Upstream with opencode Conflict Resolution
"on":
  schedule:
    - cron: '0 6 * * 6'  # 06:00 every saturday
  workflow_dispatch:
    inputs:
      force_app_build:
        description: Build and release the app even when already up to date with upstream
        required: false
        default: false
        type: boolean

# This workflow syncs with an upstream repo. When merge conflicts occur,
# opencode CLI gets full repo access to resolve them using its tools
# (Read, Edit, Grep, etc.), then a single compile check verifies the result.
#
# Configure in Forgejo UI:
#   Variables:
#     UPSTREAM_REPO_URL  - upstream git URL (public, unauthenticated fetch)
#     UPSTREAM_BRANCH    - branch to merge from upstream
#     TARGET_BRANCH      - fork branch to merge into
#     RUNNER_LABEL       - Forgejo runner label
#     LLM_ENDPOINT       - OpenAI-compatible base URL (e.g. https://integrate.api.nvidia.com/v1)
#     LLM_MODEL          - model ID served at that endpoint (e.g. nemotron-3.5-super-vl-free)
#   Secrets:
#     LLM_API_KEY        - API key for the LLM endpoint (optional if endpoint needs no auth)
#   Auth: checkout/push use the job's github.token (same Forgejo repo).

jobs:
  sync-upstream:
    runs-on: ${{ vars.RUNNER_LABEL }}
    container:
      image: alvrme/alpine-android:android-37.1-jdk21
    steps:
      - name: Install tools
        run: apk add --no-cache git curl jq nodejs npm

      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Add upstream remote
        run: |
          git remote add upstream "${{ vars.UPSTREAM_REPO_URL }}"
          git fetch upstream

      - name: Check for upstream changes
        id: check
        run: |
          git checkout "${{ vars.TARGET_BRANCH }}"
          if git merge-base --is-ancestor \
            "upstream/${{ vars.UPSTREAM_BRANCH }}" HEAD; then
            echo "Already up to date with upstream."
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.check.outputs.up_to_date != 'true'
        run: |
          git config --global user.name "forgejo-runner"
          git config --global user.email "runner@forgejo.org"

      - name: Attempt merge
        id: merge
        if: steps.check.outputs.up_to_date != 'true'
        run: |
          if git merge "upstream/${{ vars.UPSTREAM_BRANCH }}" --no-edit; then
            echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_conflicts=true" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Install opencode CLI
        if: steps.merge.outputs.has_conflicts == 'true'
        run: |
          OPENCODE_VERSION="2.0.29"
          echo "Installing opencode CLI v$OPENCODE_VERSION..."
          npm install -g "@opencode/cli@$OPENCODE_VERSION" --allow-scripts=@opencode/cli

          # The custom provider config uses @ai-sdk/openai-compatible;
          # opencode resolves npm provider packages at runtime
          npm install -g @ai-sdk/openai-compatible

          INSTALLED_VERSION=$(opencode --version 2>/dev/null || echo "")
          if [[ -z "$INSTALLED_VERSION" ]]; then
            echo "::error::opencode CLI installation failed"
            exit 1
          fi
          echo "Installed: $INSTALLED_VERSION"

      - name: Resolve conflicts with opencode
        if: steps.merge.outputs.has_conflicts == 'true'
        env:
          # Configure opencode provider inline via OPENCODE_CONFIG_CONTENT.
          # This sets up a custom OpenAI-compatible provider pointing at the
          # configured LLM endpoint (e.g. NVIDIA, Ollama, LM Studio, etc.)
          # The model variable should be in "provider/model" format for --model,
          # but since we define a custom provider, we set it as the default model.
          OPENCODE_CONFIG_CONTENT: >-
            {
              "provider": {
                "ci-llm": {
                  "npm": "@ai-sdk/openai-compatible",
                  "name": "CI LLM",
                  "options": {
                    "baseURL": "${{ vars.LLM_ENDPOINT }}",
                    "apiKey": "${{ secrets.LLM_API_KEY }}"
                  },
                  "models": {
                    "${{ vars.LLM_MODEL }}": {
                      "name": "${{ vars.LLM_MODEL }}"
                    }
                  }
                }
              },
              "model": "ci-llm/${{ vars.LLM_MODEL }}",
              "permission": "allow",
              "snapshot": false,
              "autoupdate": false
            }
        run: |
          ./scripts/opencode-resolve-merge \
            --base "upstream/${{ vars.UPSTREAM_BRANCH }}" \
            --head "${{ vars.TARGET_BRANCH }}" \
            --max-attempts 3
        # Note: --verify-command is intentionally omitted here.
        # Compiling per-conflict is slow and fails on partial merges.
        # The full build step below catches real issues.

      - name: Commit resolved merge
        if: steps.merge.outputs.has_conflicts == 'true'
        run: |
          git commit -m "Auto-merge upstream/${{ vars.UPSTREAM_BRANCH }} with opencode conflict resolution"

      - name: Handle failed conflict resolution
        if: failure() && steps.merge.outputs.has_conflicts == 'true'
        run: |
          # Stage whatever we have (including unresolved files) so git allows a commit
          git add -A
          git commit --no-verify -m "Auto-merge upstream/${{ vars.UPSTREAM_BRANCH }} (partial - manual fix required)" || true

          BRANCH_NAME="auto-merge-manual-fix-$(date +%s)"
          git checkout -b "$BRANCH_NAME"
          git push origin "$BRANCH_NAME" || true

          # Collect files that still have conflict markers
          FAILED_FILES=$(grep -rl '<<<<<<< ' . --include='*.kt' --include='*.xml' --include='*.gradle*' --include='*.json' --include='*.yaml' --include='*.properties' 2>/dev/null || echo "none detected")

          curl -s -X POST \
            "${{ github.server_url }}/api/v1/repos/nils/music-assistant-mobile-app/pulls" \
            -H "Authorization: token ${{ github.token }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg title "Manual Resolution Required: Upstream Merge" \
              --arg body "The auto-merge encountered conflicts that could not be fully resolved.\n\nFiles needing attention:\n\`\`\`\n${FAILED_FILES}\n\`\`\`" \
              --arg head "$BRANCH_NAME" \
              --arg base "${{ vars.TARGET_BRANCH }}" \
              '{title: $title, body: $body, head: $head, base: $base}')"

      - name: Push merged branch
        if: success() && steps.check.outputs.up_to_date != 'true'
        run: git push origin "${{ vars.TARGET_BRANCH }}"

      - name: Setup Gradle
        if: >-
          success() && (
            steps.check.outputs.up_to_date != 'true' ||
            inputs.force_app_build == true
          )
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        if: >-
          success() && (
            steps.check.outputs.up_to_date != 'true' ||
            inputs.force_app_build == true
          )
        run: ./gradlew :androidApp:assembleSelfSignedRelease

      - name: Prepare release assets
        if: >-
          success() && (
            steps.check.outputs.up_to_date != 'true' ||
            inputs.force_app_build == true
          )
        id: release
        run: |
          mkdir -p release-assets
          cp androidApp/build/outputs/apk/selfSignedRelease/androidApp-arm64-v8a-selfSignedRelease.apk release-assets/

          # Generate a tag from the upstream commit date + short hash
          UPSTREAM_SHORT=$(git rev-parse --short "upstream/${{ vars.UPSTREAM_BRANCH }}")
          TAG="v$(date +%Y%m%d)-${UPSTREAM_SHORT}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/forgejo-release@v2.13.4
        if: >-
          success() && (
            steps.check.outputs.up_to_date != 'true' ||
            inputs.force_app_build == true
          )
        with:
          direction: upload
          url: https://git.nilsc.org
          repo: nils/music-assistant-mobile-app
          token: ${{ github.token }}
          tag: ${{ steps.release.outputs.tag }}
          release-dir: release-assets
          release-notes: "Auto-sync with upstream (${{ steps.release.outputs.tag }})"
